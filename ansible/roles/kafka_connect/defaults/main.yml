---
connect_service_name: kafka-connect
connect_user: kafka
connect_group: kafka
connect_home: /opt/kafka
connect_plugin_path: /opt/kafka-connect/plugins
connect_jdbc_plugin_dir: "{{ connect_plugin_path }}/confluentinc-kafka-connect-jdbc-{{ connect_jdbc_version }}"
connect_rest_port: 8083
connect_group_id: connect-cluster
connect_config_topic: connect-configs
connect_offset_topic: connect-offsets
connect_status_topic: connect-status
connect_bootstrap_servers: cdc-kafka:9092
connect_listener: http://0.0.0.0:8083
connect_rest_host_name: cdc-connect
connect_debezium_version: "3.6.1.Final"
connect_jdbc_version: "10.9.7"
postgresql_jdbc_driver_version: "42.7.11"
kafka_version: "4.3.1"
kafka_scala_version: "2.13"
kafka_centos_gpg_key_url: https://www.centos.org/keys/RPM-GPG-KEY-CentOS-Official
connect_download_timeout: 600
